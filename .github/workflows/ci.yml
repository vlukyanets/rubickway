name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # System libraries: Wayland and xkbcommon to link, EGL/GLES + Mesa (llvmpipe) for the
      # rendering tests, xkb-data for the keymap tests.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl-dev libgles-dev libegl-mesa0 xkb-data
      - run: cargo fetch --locked
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
