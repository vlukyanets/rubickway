[package]
name = "rubickway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Wayland compositor with an endless canvas where every monitor is a viewer"
license = "MIT"
publish = false

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
glow = "0.18"
khronos-egl = { version = "6", features = ["static"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = "0.9"

[dev-dependencies]
proptest = "1"

[lints.rust]
# Principle V: unsafe only in FFI, backend and render modules, which opt in with
# #[allow(unsafe_code)] on the module.
unsafe_code = "deny"

[lints.clippy]
# Principle II: a client can never take the compositor down. clippy.toml allows
# these in tests; elsewhere an exception needs #[expect(..., reason = "...")].
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Principle V: every unsafe block carries a // SAFETY: comment.
undocumented_unsafe_blocks = "deny"
